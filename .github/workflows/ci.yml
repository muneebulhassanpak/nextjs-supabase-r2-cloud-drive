name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job ids lint, typecheck, test, db, build and e2e are required checks in the develop and main
# rulesets. Do not rename them.
#
# Tests use the local Supabase stack (Supabase CLI) and RustFS, never staging or production.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - name: Only the admin client may read the secret key
        run: |
          found=$(grep -rl "SUPABASE_SECRET_KEY" src | grep -v -e '^src/server/db/admin.ts$' -e '^src/env.ts$' || true)
          if [ -n "$found" ]; then
            echo "::error::SUPABASE_SECRET_KEY bypasses row-level security. Only src/server/db/admin.ts may use it: $found"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
      - run: pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Apply every migration to an empty database
        uses: ./.github/actions/local-stack
        with:
          services: db
      - name: Row-level security and database tests (pgTAP)
        run: pnpm db:test
      - name: Schema lint
        run: pnpm db:lint
      - name: Security and performance advisors
        run: pnpm db:advisors
      - name: Generated types match the schema
        run: |
          pnpm db:types
          if [ -n "$(git status --porcelain src/server/db/database.types.ts)" ]; then
            echo "::error::database.types.ts is out of date. Run 'pnpm db:types' and commit the result."
            git diff src/server/db/database.types.ts
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
      # The runner sometimes can't reach the Ubuntu package mirror; fall back to just the browser
      # (the runner image already has Chrome's system libraries).
      - name: Install Chromium
        run: |
          timeout 300 pnpm exec playwright install --with-deps chromium \
            || pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
