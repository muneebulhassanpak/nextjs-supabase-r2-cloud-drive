<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Lockerly password was changed</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial,
        sans-serif;
      color: #171717;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f5f5f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                style="
                  padding: 32px 32px 0;
                  font-size: 18px;
                  font-weight: 600;
                  letter-spacing: -0.01em;
                "
              >
                Lockerly
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 32px">
                <h1 style="margin: 0 0 12px; font-size: 20px; line-height: 28px; font-weight: 600">
                  Your password was changed
                </h1>
                <p style="margin: 0 0 24px; font-size: 14px; line-height: 22px; color: #404040">
                  The password for {{ .Email }} was just changed.
                </p>
                <p style="margin: 0; font-size: 14px; line-height: 22px; color: #404040">
                  If this wasn&#39;t you, reset your password right away:
                  <a href="{{ .SiteURL }}/forgot-password" style="color: #171717"
                    >{{ .SiteURL }}/forgot-password</a
                  >
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0; font-size: 12px; line-height: 18px; color: #737373">
            You get this email whenever your password changes.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
